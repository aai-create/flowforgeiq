kind = "web"
previewPath = "/"
title = "FlowForge"
version = "1.0.0"
id = "artifacts/flowforge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22954

[services.development]
run = "pnpm --filter @workspace/flowforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flowforge", "run", "build" ]
publicDir = "artifacts/flowforge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22954"
BASE_PATH = "/"

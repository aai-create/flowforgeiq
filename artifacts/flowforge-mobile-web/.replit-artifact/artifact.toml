kind = "web"
previewPath = "/mobile/"
title = "FlowForge Mobile"
version = "1.0.0"
id = "artifacts/flowforge-mobile-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/mobile/" ]
localPort = 22311

[services.development]
run = "pnpm --filter @workspace/flowforge-mobile-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flowforge-mobile-web", "run", "build" ]
publicDir = "artifacts/flowforge-mobile-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22311"
BASE_PATH = "/mobile/"

    <!-- Platform-specific manifest:
         iOS Safari only supports GET share_target; Android Chrome 76+ supports POST + files.
         We detect the platform at parse time and swap the manifest href accordingly. -->
    <script>
      (function () {
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        var manifestEl = document.createElement('link');
        manifestEl.rel = 'manifest';
        manifestEl.href = isIOS ? 'manifest-ios.json' : 'manifest.json';
        document.currentScript.parentNode.appendChild(manifestEl);
      })();
    </script>
    <style>
      html, body { background-color: #9000ff; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js');
        });
      }
    </script>
  </body>

        sparseThreadMinDays:     { type: integer, description: "Minimum days in current stage before the sparse check applies (default 14)" }

    CopilotSettingsUpdate:
      type: object
      properties:
        sparseThreadMinMessages: { type: integer }
        sparseThreadMinDays:     { type: integer }


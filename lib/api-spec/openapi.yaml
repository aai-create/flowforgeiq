openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: stages
  - name: buyers
  - name: suppliers
  - name: shipments
  - name: payments
  - name: quotes
  - name: messages
  - name: tasks
  - name: deals
  - name: rfqs
  - name: documents
  - name: extractions
  - name: predictions
  - name: copilot
  - name: settings
  - name: integrations
  - name: team
  - name: capture
  - name: sample-requests
  - name: reports
paths:
  /capture/mobile:
    post:
      operationId: mobileCapture
      tags: [capture]
      summary: Ingest a mobile-captured notification message (Clerk session or Bearer device token)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileCapturePayload" }
      responses:
        "200":
          description: Duplicate suppressed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileCaptureResponse" }
        "201":
          description: Message captured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileCaptureResponse" }
        "401":
          description: Unauthorized

  /import/template:
    get:
      operationId: downloadImportTemplate
      tags: [settings]
      summary: Download the pre-filled XLSX import template (admin only)
      responses:
        "200":
          description: XLSX template file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "403":
          description: Admin required
        "404":
          description: Template file not found

  /import/data:
    post:
      operationId: importData
      tags: [settings]
      summary: Parse and import an uploaded XLSX spreadsheet (admin only)
      parameters:
        - in: query
          name: dryRun
          schema: { type: boolean }
          description: "When true, parse and validate but do not write to DB"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import result (dry run or actual)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400":
          description: No file uploaded
        "401":
          description: Unauthorized
        "403":
          description: Admin required
        "422":
          description: Validation errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportValidationError" }

  /settings/contact-rules:
    get:
      operationId: listContactRules
      tags: [settings]
      summary: List contact routing rules for the org
      responses:
        "200":
          description: Contact routing rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContactRoutingRule" }
        "401":
          description: Unauthorized
    post:
      operationId: createContactRule
      tags: [settings]
      summary: Create or upsert a contact routing rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContactRuleBody" }
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactRoutingRule" }
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "404":
          description: Shipment not found

  /settings/contact-rules/{id}:
    patch:
      operationId: patchContactRule
      tags: [settings]
      summary: Update a contact routing rule (toggle active, reassign shipment)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchContactRuleBody" }
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactRoutingRule" }
        "401":
          description: Unauthorized
        "404":
          description: Rule not found
    delete:
      operationId: deleteContactRule
      tags: [settings]
      summary: Delete a contact routing rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Rule not found

  /settings/device-tokens:
    get:
      operationId: listDeviceTokens
      tags: [settings]
      summary: List device tokens for the authenticated user
      responses:
        "200":
          description: Device tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeviceToken" }
        "401":
          description: Unauthorized
    post:
      operationId: createDeviceToken
      tags: [settings]
      summary: Create a new device token (raw value returned once)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 80 }
      responses:
        "201":
          description: Created token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateDeviceTokenResponse" }
        "401":
          description: Unauthorized

  /settings/device-tokens/{id}:
    delete:
      operationId: deleteDeviceToken
      tags: [settings]
      summary: Revoke a device token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Revoked
        "401":
          description: Unauthorized
        "404":
          description: Token not found

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /stages:
    get:
      operationId: listStages
      tags: [stages]
      responses:
        "200":
          description: Stages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Stage" }
    post:
      operationId: createStage
      tags: [stages]
      summary: Create a new pipeline stage for the org (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageCreate" }
      responses:
        "201":
          description: Created stage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stage" }
        "403":
          description: Admin required
  /stages/reorder:
    post:
      operationId: reorderStages
      tags: [stages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageOrderInput" }
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Stage" }
  /stages/{id}:
    put:
      operationId: updateStage
      tags: [stages]
      summary: Rename a stage or update its sort order (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageUpdate" }
      responses:
        "200":
          description: Updated stage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stage" }
        "403":
          description: Admin required
        "404":
          description: Stage not found
    delete:
      operationId: deleteStage
      tags: [stages]
      summary: Delete a pipeline stage (admin only; 409 if shipments are at this stage)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "403":
          description: Admin required
        "409":
          description: Cannot delete — shipments currently at this stage

  /buyers:
    get:
      operationId: listBuyers
      tags: [buyers]
      responses:
        "200":
          description: Buyers list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BuyerSummary" }
    post:
      operationId: createBuyer
      tags: [buyers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerCreate" }
      responses:
        "201":
          description: Created buyer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerSummary" }

  /buyers/{id}:
    patch:
      operationId: updateBuyer
      tags: [buyers]
      summary: Update buyer contact fields
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerUpdate" }
      responses:
        "200":
          description: Updated buyer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerSummary" }
        "404":
          description: Buyer not found

  /sample-requests:
    get:
      operationId: listSampleRequests
      tags: [sample-requests]
      parameters:
        - in: query
          name: includeArchived
          schema: { type: boolean }
          description: "When true, include rejected sample requests. Defaults to false."
      responses:
        "200":
          description: Sample requests list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SampleRequest" }
    post:
      operationId: createSampleRequest
      tags: [sample-requests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleRequestCreate" }
      responses:
        "201":
          description: Created sample request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleRequest" }

  /sample-requests/{id}:
    get:
      operationId: getSampleRequest
      tags: [sample-requests]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sample request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleRequest" }
        "404":
          description: Not found
    patch:
      operationId: updateSampleRequest
      tags: [sample-requests]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleRequestUpdate" }
      responses:
        "200":
          description: Updated sample request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleRequest" }
        "404":
          description: Not found

  /sample-requests/{id}/convert:
    post:
      operationId: convertSampleRequestToPo
      tags: [sample-requests]
      summary: Convert an approved sample request to a shipment PO
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleRequestConvertInput" }
      responses:
        "201":
          description: Created shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "400":
          description: Validation error
        "404":
          description: Sample request not found

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      responses:
        "200":
          description: Suppliers with thread counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierSummary" }
    post:
      operationId: createSupplier
      tags: [suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierCreate" }
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierSummary" }

  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update supplier fields (e.g. contactEmail)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierUpdate" }
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierSummary" }
        "404":
          description: Supplier not found

  /deals:
    get:
      operationId: listDeals
      tags: [deals]
      summary: List all deals with embedded shipments and computed spread
      responses:
        "200":
          description: All deals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DealWithSpread" }
    post:
      operationId: createDeal
      tags: [deals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealInput" }
      responses:
        "201":
          description: Created deal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealWithSpread" }
  /deals/{id}:
    get:
      operationId: getDeal
      tags: [deals]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deal with spread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealWithSpread" }
    patch:
      operationId: updateDeal
      tags: [deals]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealInput" }
      responses:
        "200":
          description: Updated deal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealWithSpread" }

  /shipments:
    get:
      operationId: listShipments
      tags: [shipments]
      parameters:
        - in: query
          name: includeArchived
          schema: { type: boolean }
          description: "When true, include archived shipments in the response. Defaults to false."
      responses:
        "200":
          description: All shipments with embedded payments and quotes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Shipment" }
    post:
      operationId: createShipment
      tags: [shipments]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentCreate" }
      responses:
        "201":
          description: Created shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
  /shipments/{id}:
    delete:
      operationId: deleteShipment
      tags: [shipments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Shipment deleted
        "404":
          description: Not found
    patch:
      operationId: updateShipment
      tags: [shipments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentUpdate" }
      responses:
        "200":
          description: Updated shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }

  /payments/{id}:
    patch:
      operationId: updatePayment
      tags: [payments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentUpdate" }
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }

  /shipments/{id}/quotes:
    get:
      operationId: listShipmentQuotes
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Quotes for shipment
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FactoryQuote" }
    post:
      operationId: createFactoryQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryQuoteCreate" }
      responses:
        "201":
          description: Created quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryQuote" }

  /shipments/{id}/deal:
    patch:
      operationId: patchShipmentDeal
      tags: [shipments]
      summary: Set or update buyer unit price and quantity on the linked deal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchShipmentDealBody" }
      responses:
        "200":
          description: Updated shipment with recalculated spread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "404":
          description: Shipment not found

  /shipments/{id}/deal/adjustments:
    post:
      operationId: createDealAdjustment
      tags: [deals]
      summary: Add a hidden-cost adjustment line to the shipment's linked deal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealAdjustmentInput" }
      responses:
        "201":
          description: Updated shipment with recalculated spread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "404":
          description: Shipment or linked deal not found

  /shipments/{id}/deal/adjustments/{adjustmentId}:
    patch:
      operationId: updateDealAdjustment
      tags: [deals]
      summary: Update a hidden-cost adjustment line on the shipment's linked deal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: adjustmentId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealAdjustmentUpdate" }
      responses:
        "200":
          description: Updated shipment with recalculated spread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "404":
          description: Shipment, deal, or adjustment not found
    delete:
      operationId: deleteDealAdjustment
      tags: [deals]
      summary: Remove a hidden-cost adjustment line from the shipment's linked deal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: adjustmentId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated shipment with recalculated spread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "404":
          description: Shipment, deal, or adjustment not found

  /shipments/{id}/deals:
    post:
      operationId: linkDealToShipment
      tags: [shipments]
      summary: Link an existing deal (buyer PO) to this shipment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dealId]
              properties:
                dealId: { type: integer }
      responses:
        "201":
          description: Shipment with updated buyer PO links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "404":
          description: Shipment or deal not found

  /shipments/{id}/deals/{dealId}:
    delete:
      operationId: unlinkDealFromShipment
      tags: [shipments]
      summary: Unlink a deal from this shipment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: dealId
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Unlinked successfully

  /shipments/{id}/stage-events:
    get:
      operationId: listShipmentStageEvents
      tags: [shipments]
      summary: Get stage advancement history for a shipment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Stage event history (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StageEvent" }
    post:
      operationId: createShipmentStageEvent
      tags: [shipments]
      summary: Record a stage advancement with optional note
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageEventInput" }
      responses:
        "201":
          description: Created stage event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StageEvent" }

  /shipments/{id}/select-quote:
    post:
      operationId: selectFactoryQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteSelection" }
      responses:
        "200":
          description: Updated quotes for shipment
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FactoryQuote" }

  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      parameters:
        - in: query
          name: isFlagged
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: All messages newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: createMessage
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /messages/needs-review:
    get:
      operationId: listNeedsReviewMessages
      tags: [messages]
      summary: Messages that could not be auto-routed and need manual assignment
      responses:
        "200":
          description: Needs-review messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }

  /messages/{id}:
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Permanently delete a message
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Message not found
    patch:
      operationId: updateMessage
      tags: [messages]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /messages/{id}/assign:
    patch:
      operationId: assignMessage
      tags: [messages]
      summary: Manually assign a needs-review message to a buyer and shipment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageAssignInput" }
      responses:
        "200":

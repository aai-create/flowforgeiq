        - snippet
        - fullBody
        - aiDraft
        - aiAction
        - aiTags
        - unread
        - isFlagged
        - receivedAt
        - routingStatus
      properties:
        id:                     { type: integer }
        shipmentId:             { type: ["integer", "null"], description: "null for needs-review messages not yet assigned to a shipment" }
        supplierId:             { type: ["integer", "null"] }
        sender:                 { type: string }
        recipient:              { type: ["string", "null"], description: "Outbound recipient — supplier email or name" }
        channel:                { type: string }
        subject:                { type: ["string", "null"], description: "Subject line for outbound email messages" }
        direction:              { type: string, enum: [inbound, outbound], default: inbound }
        snippet:                { type: string }
        fullBody:               { type: string }
        aiDraft:                { type: string }
        aiAction:               { type: string }
        aiTags:
          type: array
          items: { type: string }
        unread:                 { type: boolean }
        isFlagged:              { type: boolean }
        receivedAt:             { type: string, format: date-time }
        routingStatus:          { type: string, enum: [routed, needs-review], description: "routed = auto-assigned; needs-review = awaiting manual assignment" }
        routingConfidence:      { type: ["number", "null"], description: "0–1 confidence of the auto-routing decision" }
        matchMethod:            { type: ["string", "null"], description: "How the sender was matched: exact-email | exact-domain | fuzzy-name | buyer-learned | ai-inferred | unresolvable" }
        rawSenderEmail:         { type: ["string", "null"], description: "The original sender email address" }
        rawChatText:            { type: ["string", "null"], description: "Original pasted or forwarded chat text for audit" }

        sequenceFormat: { type: string }
        supplierSuffix: { type: string }
        resetSeq:       { type: integer, description: "Reset the sequence counter to this value (must be positive integer)" }

    InboundEmailHealth:
      type: object
      required: [status, configured, inboundEmailAddress, message]
      properties:
        status:
          type: string
          enum: [healthy, stale, unknown]
          description: "healthy = received within 7 days; stale = received but older than 7 days; unknown = no inbound email ever received"
        configured:
          type: boolean
          description: "True when INBOUND_EMAIL_BASE resolves to a live inbound subdomain (e.g. inbound.flowforgeiq.com)"
        inboundEmailAddress:
          type: string
          description: "The caller's personal inbound address assembled from INBOUND_EMAIL_BASE and their inbound handle/token"
        lastReceivedAt:
          type: ["string", "null"]
          format: date-time
          description: "ISO timestamp of the most recent inbound email, or null if none"
        lastReceivedFrom:
          type: ["string", "null"]
          description: "Sender of the most recent inbound email, or null if none"
        lastReceivedSubject:
          type: ["string", "null"]
          description: "Subject line of the most recent inbound email, or null if none"
        hoursSinceLastReceived:
          type: ["number", "null"]
          description: "Hours since the last inbound email was received, or null if none"
        message:
          type: string
          description: "Human-readable summary of the health status"

    InboundEmailAddress:
      type: object
      required: [inboundEmailAddress]
      properties:
        inboundEmailAddress: { type: string, description: "The authenticated user's personal inbound address (iq+{handle}@flowforgeiq.com), assembled from INBOUND_EMAIL_BASE env var and the user's inbound handle" }

    UpdateInboundHandleBody:
      type: object
      required: [handle]
      properties:
        handle: { type: string, minLength: 3, maxLength: 40, description: "Lowercase alphanumeric slug with dots/hyphens (3–40 chars). Becomes the + part of the inbound address." }

    ChatIngestInput:
      type: object
      required: [rawText, channel]
      properties:
        rawText:    { type: string, description: "Raw pasted chat text (WhatsApp export, WeChat transcript, iMessage forward, etc.)" }
        channel:    { type: string, enum: [whatsapp, wechat, imessage, sms, email, other], description: "Source messaging platform" }
        senderHint: { type: string, description: "Optional hint for the supplier/contact name when auto-detection may be ambiguous" }

    ChatExtractedFields:
      type: object
      properties:
        eta:           { type: string,  description: "Estimated arrival or ex-factory date extracted from the message" }
        quotePrice:    { type: number,  description: "Unit price or total quote amount mentioned" }
        productionPct: { type: integer, description: "Production completion percentage (0–100)" }
        qcNote:        { type: string,  description: "QC status or findings" }
        statusUpdate:  { type: string,  description: "Shipment status signal: on-track | at-risk | delayed" }

    ChatIngestResult:
      type: object
      required: [routingStatus, confidence, sender, snippet, fullBody, aiDraft, aiAction, aiTags]
      properties:
        routingStatus:   { type: string, enum: [routed, needs-review] }
        shipmentId:      { type: ["integer", "null"] }
        supplierId:      { type: ["integer", "null"] }
        confidence:      { type: number }
        matchMethod:     { type: ["string", "null"] }
        extractedFields: { $ref: "#/components/schemas/ChatExtractedFields" }
        sender:          { type: string }
        snippet:         { type: string }
        fullBody:        { type: string }
        aiDraft:         { type: string }
        aiAction:        { type: string }
        aiTags:
          type: array
          items: { type: string }

    InboundEmailWebhookResponse:
      type: object
      required: [accepted, documentIds]
      properties:
        accepted: { type: boolean }
        documentIds:
          type: array
          items: { type: integer }

    MessageAssignInput:
      type: object
      required: [buyerName, shipmentId]
      properties:
        buyerName:  { type: string, description: "Customer / buyer name to associate with this sender" }
        shipmentId: { type: integer, description: "Shipment to thread this message into" }

    SendReplyInput:
      type: object
      required: [body]
      properties:
        body:       { type: string, description: "Reply body text" }
        subject:    { type: string, description: "Override subject line (defaults to Re: original subject)" }
        to:         { type: string, description: "Recipient email address (defaults to rawSenderEmail)" }

    GmailStatus:
      type: object
      required: [connected, clientConfigured]
      properties:
        connected:        { type: boolean }
        gmailAddress:     { type: string, nullable: true }
        clientConfigured: { type: boolean, description: "True when GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are set" }

    RfqQuote:
      type: object
      required: [id, rfqId, factoryName, country, unitPriceUsd, leadTimeDays, moq, status, sortOrder]
      properties:
        id:            { type: integer }
        rfqId:         { type: integer }
        supplierId:    { type: ["integer", "null"] }
        factoryName:   { type: string }
        country:       { type: string }
        unitPriceUsd:  { type: number }
        leadTimeDays:  { type: integer }
        moq:           { type: integer }
        notes:         { type: ["string", "null"] }
        status:        { type: string, enum: [pending, received, accepted, rejected] }
        sortOrder:     { type: integer }

    RfqQuoteCreate:
      type: object
      required: [factoryName, unitPriceUsd, leadTimeDays, moq]
      properties:
        supplierId:   { type: integer }
        factoryName:  { type: string }
        country:      { type: string }
        unitPriceUsd: { type: number }
        leadTimeDays: { type: integer }
        moq:          { type: integer }
        notes:        { type: string }
        status:       { type: string, enum: [pending, received, accepted, rejected] }

    RfqQuoteUpdate:
      type: object
      properties:
        factoryName:  { type: string }
        country:      { type: string }
        unitPriceUsd: { type: number }
        leadTimeDays: { type: integer }
        moq:          { type: integer }
        notes:        { type: ["string", "null"] }
        status:       { type: string, enum: [pending, received, accepted, rejected] }

    RfqWithQuotes:
      type: object
      required: [id, product, category, buyerName, targetPriceUsd, quantity, deadline, status, createdAt, quotes]
      properties:
        id:             { type: integer }
        product:        { type: string }
        category:       { type: string }
        buyerName:      { type: string }
        targetPriceUsd: { type: number }
        quantity:       { type: integer }
        deadline:       { type: string, format: date-time }
        status:         { type: string, enum: [open, accepted, cancelled] }
        notes:          { type: ["string", "null"] }
        assigneeId:     { type: ["string", "null"], description: "Clerk user ID of the assigned team member; null if unassigned" }
        assigneeName:   { type: ["string", "null"], description: "Display name of the assigned team member; null if unassigned" }
        convertedShipmentId: { type: ["integer", "null"], description: "Shipment ID created when this RFQ was converted to a PO" }
        createdAt:      { type: string, format: date-time }
        quotes:
          type: array
          items: { $ref: "#/components/schemas/RfqQuote" }

    RfqCreate:
      type: object
      required: [product, buyerName, targetPriceUsd, quantity, deadline]
      properties:
        product:        { type: string }
        category:       { type: string }
        buyerName:      { type: string }
        targetPriceUsd: { type: number }
        quantity:       { type: integer }
        deadline:       { type: string, format: date-time }
        notes:          { type: string }
        assigneeId:     { type: ["string", "null"], description: "Clerk user ID of the team member to assign; null to leave unassigned" }

    RfqUpdate:
      type: object
      properties:
        product:        { type: string }
        category:       { type: string }
        buyerName:      { type: string }
        targetPriceUsd: { type: number }
        quantity:       { type: integer }
        deadline:       { type: string, format: date-time }
        notes:          { type: ["string", "null"] }
        status:         { type: string, enum: [open, accepted, cancelled] }
        assigneeId:     { type: ["string", "null"], description: "Clerk user ID of the team member to assign; null to unassign" }

    RfqConvertInput:
      type: object
      required: [acceptedQuoteId, poNumber, supplierId, dueDate, exFactoryDate, destination]
      properties:
        acceptedQuoteId: { type: integer, description: "The RFQ quote ID to mark as accepted" }
        poNumber:        { type: string, description: "Supplier-facing PO number (trader→supplier)" }
        supplierId:      { type: integer }
        dueDate:         { type: string, format: date-time }
        exFactoryDate:   { type: string, format: date-time }
        destination:     { type: string }
        via:             { type: string }
        notes:           { type: string }
        depositPct:      { type: integer, description: "Deposit percentage (default 30)" }

    ProformaInvoice:
      type: object
      required: [rfqId, shipmentId, poNumber, buyerName, product, quantity, unitPriceUsd, totalUsd, depositPct, depositUsd, balanceUsd, deadline, generatedAt]
      properties:
        rfqId:        { type: integer }
        shipmentId:   { type: integer }
        poNumber:     { type: string }
        buyerName:    { type: string }
        product:      { type: string }
        quantity:     { type: integer }
        unitPriceUsd: { type: number }
        totalUsd:     { type: number }
        depositPct:   { type: integer }
        depositUsd:   { type: number }
        balanceUsd:   { type: number }
        paymentTerms: { type: string }
        deadline:     { type: string, format: date-time }
        supplierName: { type: string }
        supplierCountry: { type: string }
        generatedAt:  { type: string, format: date-time }

    SendRfqEmailBody:
      type: object
      required: [to, subject, body]
      properties:
        to:
          type: array
          items: { type: string }
        subject: { type: string }
        body: { type: string }

    SendRfqEmailResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    MobileCapturePayload:
      type: object
      required: [senderRaw, messageText, channel]
      properties:
        senderRaw:   { type: string, description: "Raw sender identifier (phone number, name, or alias)" }
        messageText: { type: string, description: "Full text of the captured message" }
        channel:     { type: string, enum: [whatsapp, wechat, imessage, sms, email, other] }
        capturedAt:  { type: string, format: date-time, description: "When the notification was captured on device" }
        appPackage:  { type: ["string", "null"], description: "Source app package (e.g. com.whatsapp)" }
        deviceId:    { type: ["string", "null"], description: "Opaque device identifier for dedup" }

    MobileCaptureResponse:
      type: object
      required: [status, messageId]
      properties:
        status:              { type: string, enum: [captured, duplicate] }
        messageId:           { type: integer }
        routingStatus:       { type: ["string", "null"] }
        resolvedContactId:   { type: ["integer", "null"] }
        resolvedContactType:
          oneOf:
            - { type: string, enum: [supplier, buyer] }
            - { type: "null" }

    DeviceToken:
      type: object
      required: [id, label, createdAt]
      properties:
        id:          { type: integer }
        label:       { type: string }
        createdAt:   { type: string, format: date-time }
        lastUsedAt:  { type: ["string", "null"], format: date-time }

    CreateDeviceTokenResponse:
      type: object
      required: [id, label, createdAt, token]
      properties:
        id:         { type: integer }
        label:      { type: string }
        createdAt:  { type: string, format: date-time }
        lastUsedAt: { type: ["string", "null"], format: date-time }
        token:      { type: string, description: "Raw token value — returned only once at creation" }

    ContactRoutingRule:
      type: object
      required: [id, channel, senderId, shipmentId, active, createdAt, updatedAt]
      properties:
        id:                 { type: integer }
        channel:            { type: string, description: "Messaging channel — email, whatsapp, sms, wechat, imessage, or other" }
        senderId:           { type: string, description: "Universal sender identifier: email address for email rules; phone number, display name, or handle for chat/SMS rules" }
        fromEmail:          { type: ["string", "null"], description: "Populated for email rules only (equals senderId); null for chat/SMS rules" }
        shipmentId:         { type: integer }
        poNumber:           { type: ["string", "null"] }
        active:             { type: boolean }
        deactivationReason: { type: ["string", "null"], description: "Why the rule was auto-deactivated (e.g. 'shipment-closed', 'org-mismatch'); null when deactivated manually or rule is still active" }
        createdBy:          { type: ["string", "null"] }
        createdAt:          { type: string, format: date-time }
        updatedAt:          { type: string, format: date-time }

    ImportValidationError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              sheet:   { type: string }
              row:     { type: integer }
              column:  { type: string }
              message: { type: string }

    ImportResult:
      type: object
      properties:
        dryRun: { type: boolean }
        suppliers:
          type: array
          items:
            type: object
            properties:
              row:  { type: integer }
              data: { type: object }
        shipments:
          type: array
          items:
            type: object
            properties:
              row:  { type: integer }
              data: { type: object }
        payments:
          type: array
          items:
            type: object
            properties:
              row:  { type: integer }
              data: { type: object }
        errors:
          type: array
          items:
            type: object
            properties:
              sheet:   { type: string }
              row:     { type: integer }
              column:  { type: string }
              message: { type: string }
        inserted:
          type: object
          properties:
            suppliers: { type: integer }
            shipments:  { type: integer }
            payments:   { type: integer }
        skipped:
          type: object
          properties:
            suppliers: { type: integer }
            shipments:  { type: integer }
            payments:   { type: integer }

    CreateContactRuleBody:
      type: object
      required: [senderId, shipmentId]
      properties:
        senderId:   { type: string, description: "Universal sender identifier — email address, phone number, display name, or handle" }
        channel:    { type: string, enum: [email, whatsapp, sms, wechat, imessage, other], description: "Messaging channel; defaults to email when omitted" }
        fromEmail:  { type: string, format: email, description: "Deprecated — use senderId instead; kept for backwards compatibility with email rules" }
        shipmentId: { type: integer }

    PatchContactRuleBody:
      type: object
      properties:
        active:     { type: boolean }
        shipmentId: { type: integer }

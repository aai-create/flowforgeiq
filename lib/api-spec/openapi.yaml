        outboundMessageId: { type: ["integer", "null"] }

    CopilotProposal:
      type: object
      required: [id, triggerType, actionType, payload, reasoning, confidence, status, createdAt, updatedAt]
      properties:
        id:                  { type: integer }
        shipmentId:          { type: ["integer", "null"] }
        source:              { type: string, description: "copilot_trigger | signal_inbox" }
        triggerType:         { type: string }
        triggerRef:          { type: ["string", "null"] }
        actionType:          { type: string }
        payload:             { type: object, additionalProperties: true }
        reasoning:           { type: string }
        confidence:          { type: number }
        status:              { type: string }
        snoozedUntil:        { type: ["string", "null"], format: date-time }
        editedPayload:       { type: ["object", "null"], additionalProperties: true }
        userEditedContent:   { type: ["string", "null"], description: "Extracted edited draftBody text saved when user approves an edit" }
        editDistance:        { type: ["number", "null"], description: "Normalized 0–1 edit distance between AI draft and user edit; 0 = identical, 1 = fully rewritten" }
        auditTrail:          { type: array, items: { type: object, additionalProperties: true } }
        sparseThreadWarning: { type: ["boolean", "null"], description: "True when the thread has fewer messages than usual for the current stage duration — possible capture gap" }
        sparseMessageCount:  { type: ["integer", "null"], description: "Number of messages linked to this shipment at proposal time" }
        sparseDaysInStage:   { type: ["integer", "null"], description: "Days the shipment has been in its current stage at proposal time" }
        createdAt:           { type: string, format: date-time }
        updatedAt:           { type: string, format: date-time }

    CopilotProposalInput:
      type: object
      required: [shipmentId, triggerType, actionType, payload, reasoning]
      properties:
        shipmentId:  { type: integer }
        triggerType: { type: string }
        triggerRef:  { type: string }
        actionType:  { type: string }
        payload:     { type: object, additionalProperties: true }
        reasoning:   { type: string }
        confidence:  { type: number }

    CopilotProposalUpdate:
      type: object
      properties:
        status:        { type: string }
        editedPayload: { type: object, additionalProperties: true }
        snoozedUntil:  { type: string, format: date-time }

    CopilotTriggerResult:
      type: object
      required: [scanned, created, autoExecuted]
      properties:
        scanned:      { type: integer }
        created:      { type: integer }
        autoExecuted: { type: integer }
        proposals:
          type: array
          items: { $ref: "#/components/schemas/CopilotProposal" }

    CopilotDraftQualityEntry:

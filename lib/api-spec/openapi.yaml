      responses:
        "200":
          description: Proforma invoice data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProformaInvoice" }
        "404":
          description: Not found or not yet converted

  /rfqs/buyers:
    get:
      operationId: listRfqBuyers
      tags: [rfqs]
      summary: List distinct buyer names from all RFQs
      responses:
        "200":
          description: Alphabetically sorted distinct buyer names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /rfqs/{id}/send-email:
    post:
      operationId: sendRfqEmail
      tags: [rfqs]
      summary: Send the RFQ details to supplier contacts via email
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendRfqEmailBody" }
      responses:
        "200":
          description: Email sent successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendRfqEmailResponse" }
        "404":
          description: RFQ not found
        "500":
          description: Email delivery failed

  /org:
    get:
      operationId: getOrg
      tags: [team]
      summary: Get the current user's organization
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgResponse" }
        "401":
          description: Unauthorized
        "404":
          description: Organization not found

  /settings/org:
    patch:
      operationId: updateOrg
      tags: [team]
      summary: Update org-level settings (admin only)
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrgBody" }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgResponse" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin only
        "404":
          description: Organization not found

  /team:
    get:
      operationId: getTeam
      tags: [team]
      summary: List team members and pending invitations
      responses:
        "200":
          description: Team data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamResponse" }
        "401":
          description: Unauthorized

  /team/me:
    get:
      operationId: getMyProfile
      tags: [team]
      summary: Get the current user's team profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/TeamMember" }
        "401":
          description: Unauthorized
        "404":
          description: Not provisioned

  /team/provision-self:
    post:
      operationId: provisionSelf
      tags: [team]
      summary: JIT-provision the authenticated user in the team (first user becomes admin)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:  { type: string }
                email: { type: string }
      responses:
        "200":
          description: Already provisioned
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/TeamMember" }
        "201":
          description: Newly provisioned
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/TeamMember" }
        "401":
          description: Unauthorized

  /team/invite:
    post:
      operationId: inviteTeamMember
      tags: [team]
      summary: Invite a colleague by email (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInviteInput" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamInviteResponse" }
        "401":
          description: Unauthorized
        "403":
          description: Admin only

  /team/{userId}:
    delete:
      operationId: removeTeamMember
      tags: [team]
      summary: Remove a team member (admin only)
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "401":
          description: Unauthorized
        "403":
          description: Admin only

  /team/invitations/{id}:
    delete:
      operationId: cancelInvitation
      tags: [team]
      summary: Cancel a pending invitation (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Cancelled
        "401":
          description: Unauthorized
        "403":
          description: Admin only

  /team/accept-invite:
    post:
      operationId: acceptInvite
      tags: [team]
      summary: Accept a team invitation using a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/TeamMember" }
        "401":
          description: Unauthorized
        "404":
          description: Invitation not found

components:
  schemas:
    OrgResponse:
      type: object
      required: [id, name, slug, visibilityMode]
      properties:
        id:             { type: integer }
        name:           { type: string }
        slug:           { type: string }
        visibilityMode: { type: string, enum: [shared, private] }

    UpdateOrgBody:
      type: object
      required: [visibilityMode]
      properties:
        visibilityMode: { type: string, enum: [shared, private] }

    TeamMember:
      type: object
      required: [clerkUserId, email, name, role, createdAt]
      properties:
        clerkUserId: { type: string }
        email:       { type: string }
        name:        { type: string }
        role:        { type: string, enum: [admin, manager, member] }
        createdAt:   { type: string, format: date-time }

    TeamInvitation:
      type: object
      required: [id, email, role, token, invitedBy, createdAt, inviteUrl]
      properties:
        id:         { type: integer }
        email:      { type: string }
        role:       { type: string }
        token:      { type: string }
        invitedBy:  { type: string }
        createdAt:  { type: string, format: date-time }
        acceptedAt: { type: ["string", "null"], format: date-time }
        inviteUrl:  { type: string }

    TeamResponse:
      type: object
      required: [members, pendingInvitations]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/TeamMember" }
        pendingInvitations:
          type: array
          items: { $ref: "#/components/schemas/TeamInvitation" }

    TeamInviteInput:
      type: object
      required: [email]
      properties:
        email: { type: string }
        role:  { type: string, enum: [admin, member] }

    TeamInviteResponse:
      type: object
      required: [invitation, inviteUrl]
      properties:
        invitation: { $ref: "#/components/schemas/TeamInvitation" }
        inviteUrl:  { type: string }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Stage:
      type: object
      required: [id, label, sortOrder]
      properties:
        id:        { type: string }
        label:     { type: string }
        sortOrder: { type: integer }
    StageCreate:
      type: object
      required: [id, label]
      properties:
        id:    { type: string, description: "Stable text key for this stage (e.g. 'stage-customs'). Must be unique within the org." }
        label: { type: string, description: "Display name shown to users." }
    StageUpdate:
      type: object
      properties:
        label:     { type: string, description: "New display name for the stage." }
        sortOrder: { type: integer, description: "New sort position." }
    StageOrderInput:
      type: object
      required: [stageIds]
      properties:
        stageIds:
          type: array
          items: { type: string }

    BuyerSummary:
      type: object
      required: [id, name]
      properties:
        id:          { type: integer }
        name:        { type: string }
        contactName: { type: string, nullable: true }
        email:       { type: string, nullable: true }
        phone:       { type: string, nullable: true }
        region:      { type: string, nullable: true }

    BuyerCreate:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        contactName: { type: string }
        email:       { type: string }
        phone:       { type: string }
        region:      { type: string }

    BuyerUpdate:
      type: object
      properties:
        name:        { type: string }
        contactName: { type: string, nullable: true }
        email:       { type: string, nullable: true }
        phone:       { type: string, nullable: true }
        region:      { type: string, nullable: true }

    SampleRequest:
      type: object
      required: [id, orgId, product, milestone, createdAt, updatedAt]
      properties:
        id:                   { type: integer }
        orgId:                { type: integer }
        supplierId:           { type: ["integer", "null"] }
        supplierName:         { type: ["string", "null"] }
        buyerId:              { type: ["integer", "null"] }
        buyerName:            { type: ["string", "null"] }
        product:              { type: string }
        quantity:             { type: ["integer", "null"] }
        notes:                { type: ["string", "null"] }
        milestone:            { type: string, enum: [sample_requested, sample_shipped, sample_received, approved, rejected] }
        trackingCode:         { type: ["string", "null"] }
        carrierName:          { type: ["string", "null"] }
        convertedShipmentId:  { type: ["integer", "null"] }
        createdAt:            { type: string, format: date-time }
        updatedAt:            { type: string, format: date-time }

    SampleRequestCreate:
      type: object
      required: [product]
      properties:
        supplierId:  { type: integer }
        buyerId:     { type: integer }
        product:     { type: string }
        quantity:    { type: integer }
        notes:       { type: string }
        milestone:   { type: string, enum: [sample_requested, sample_shipped, sample_received, approved, rejected] }
        trackingCode: { type: string }
        carrierName: { type: string }

    SampleRequestUpdate:
      type: object
      properties:
        supplierId:   { type: ["integer", "null"] }
        buyerId:      { type: ["integer", "null"] }
        product:      { type: string }
        quantity:     { type: ["integer", "null"] }
        notes:        { type: ["string", "null"] }
        milestone:    { type: string, enum: [sample_requested, sample_shipped, sample_received, approved, rejected] }
        trackingCode: { type: ["string", "null"] }
        carrierName:  { type: ["string", "null"] }

    SampleRequestConvertInput:
      type: object
      required: [poNumber, supplierId, dueDate, exFactoryDate, destination]
      properties:
        poNumber:      { type: string }
        supplierId:    { type: integer }
        buyerId:       { type: ["integer", "null"] }
        dueDate:       { type: string, format: date-time }
        exFactoryDate: { type: string, format: date-time }
        destination:   { type: string }
        via:           { type: string }
        depositPct:    { type: integer, description: "Deposit percentage (default 30)" }
        notes:         { type: string }

    SupplierSummary:
      type: object
      required: [id, name, country, threadCount]
      properties:
        id:             { type: integer }
        name:           { type: string }
        country:        { type: string }
        contactEmail:   { type: string, nullable: true }
        contactName:    { type: string, nullable: true }
        whatsAppNumber: { type: string, nullable: true }
        paymentTerms:   { type: string, nullable: true }
        threadCount:    { type: integer }

    SupplierCreate:
      type: object
      required: [name]
      properties:
        name:           { type: string }
        country:        { type: string }
        contactEmail:   { type: string }
        contactName:    { type: string }
        whatsAppNumber: { type: string }
        paymentTerms:   { type: string }
    SupplierUpdate:
      type: object
      properties:
        name:           { type: string }
        country:        { type: string }
        contactEmail:   { type: string, nullable: true }
        contactName:    { type: string, nullable: true }
        whatsAppNumber: { type: string, nullable: true }
        paymentTerms:   { type: string, nullable: true }

    Payment:
      type: object
      required: [id, shipmentId, label, percent, amountUsd, paid, dueDate, sortOrder]
      properties:
        id:                      { type: integer }
        shipmentId:              { type: integer }
        label:                   { type: string }
        percent:                 { type: integer }
        amountUsd:               { type: integer }
        paid:                    { type: boolean }
        dueDate:                 { type: string, format: date-time }
        sortOrder:               { type: integer }
        paidAt:                  { type: string, format: date-time, nullable: true }
        referenceNumber:         { type: string, nullable: true }
        method:                  { type: string, nullable: true }
        buyerSharePct:                  { type: integer, nullable: true, description: "Percentage of amountUsd the Buyer committed upfront (e.g. 40). Null means no intermediary financing on this payment." }
        intermediaryAdvanceUsd:         { type: integer, nullable: true, description: "USD amount the Intermediary has fronted to the Supplier on behalf of the Buyer." }
        intermediaryRecoveredUsd:       { type: integer, nullable: true, description: "USD amount the Intermediary has already recovered from the Buyer." }
        invoiceNumber:                  { type: string, nullable: true, description: "Supplier invoice number for this payment." }
        intermediarySupplierPaidUsd:    { type: integer, nullable: true, description: "USD amount the Intermediary has actually wired to the Supplier." }
        intermediarySupplierPaidAt:     { type: string, format: date-time, nullable: true, description: "Date the Intermediary wired funds to the Supplier." }
    PaymentUpdate:
      type: object
      properties:
        paid:                     { type: boolean }
        amountUsd:                { type: integer }
        paidAt:                   { type: string, format: date-time, nullable: true }
        referenceNumber:          { type: string, nullable: true }
        method:                   { type: string, nullable: true }
        intermediaryRecoveredUsd:       { type: integer, nullable: true, description: "USD amount recovered from the Buyer to repay the Intermediary." }
        intermediaryRecoveredAt:        { type: string, format: date-time, nullable: true, description: "Date the recovery was recorded." }
        invoiceNumber:                  { type: string, nullable: true, description: "Supplier invoice number for this payment." }
        intermediarySupplierPaidUsd:    { type: integer, nullable: true, description: "USD amount the Intermediary has actually wired to the Supplier." }
        intermediarySupplierPaidAt:     { type: string, format: date-time, nullable: true, description: "Date the Intermediary wired funds to the Supplier." }

    FactoryQuote:
      type: object
      required: [id, shipmentId, factory, country, unitPrice, leadDays, moq, selected, sortOrder]
      properties:
        id:           { type: integer }
        shipmentId:   { type: integer }
        factory:      { type: string }
        country:      { type: string }
        unitPrice:    { type: number }
        leadDays:     { type: integer }
        moq:          { type: integer }
        selected:     { type: boolean }
        sortOrder:    { type: integer }
        validityDate: { type: string, nullable: true }
        notes:        { type: string, nullable: true }
    FactoryQuoteCreate:
      type: object
      required: [factory, unitPrice, leadDays, moq]
      properties:
        factory:      { type: string }
        country:      { type: string }
        unitPrice:    { type: number }
        leadDays:     { type: integer }
        moq:          { type: integer }
        validityDate: { type: string }
        notes:        { type: string }
    QuoteSelection:
      type: object
      required: [quoteId]
      properties:
        quoteId: { type: integer }

    PatchShipmentDealBody:
      type: object
      properties:
        buyerUnitPrice:  { type: number, description: "Buyer-facing unit price (USD)" }
        buyerQuantity:   { type: integer, description: "Total buyer quantity" }
        targetSpreadPct: { type: ["number", "null"], description: "Target spread % for the linked deal. Null clears the target." }

    DealInput:
      type: object
      required: [buyerPoNumber, customerName, buyerTotalUsd, buyerUnitPrice, buyerQuantity]
      properties:
        buyerPoNumber:   { type: string }
        customerName:    { type: string }
        buyerTotalUsd:   { type: number }
        buyerUnitPrice:  { type: number }
        buyerQuantity:   { type: integer }
        currency:        { type: string }
        notes:           { type: string }
        targetSpreadPct: { type: ["number", "null"], description: "Target spread % for the deal. Null clears the target." }

    DealAdjustment:
      type: object
      required: [id, dealId, label, type, value]
      properties:
        id:        { type: integer }
        dealId:    { type: integer }
        label:     { type: string }
        type:      { type: string, enum: [flat, percent], description: "flat = USD amount; percent = percent of buyer total" }
        value:     { type: number, description: "Dollar amount when type=flat; percent (e.g. 4 for 4%) when type=percent" }
        sortOrder: { type: integer }
    DealAdjustmentInput:
      type: object
      required: [label, type, value]
      properties:
        label: { type: string }
        type:  { type: string, enum: [flat, percent] }
        value: { type: number }
    DealAdjustmentUpdate:
      type: object
      properties:
        label: { type: string }
        type:  { type: string, enum: [flat, percent] }
        value: { type: number }

    DealShipmentLeg:
      type: object
      required: [id, poNumber, product, supplierName, supplierCost, status, currentStageId, exFactoryDate]
      properties:
        id:             { type: integer }
        poNumber:       { type: string }
        product:        { type: string }
        supplierName:   { type: string }
        supplierCost:   { type: number }
        supplierPaid:   { type: number }
        status:         { type: string }
        currentStageId: { type: string }
        exFactoryDate:  { type: string, format: date-time }

    DealWithSpread:
      type: object
      required:
        - id
        - buyerPoNumber
        - customerName
        - buyerTotalUsd
        - buyerUnitPrice
        - buyerQuantity
        - currency
        - supplierCostUsd
        - supplierPaidUsd
        - spreadUsd
        - spreadPct
        - legs
        - createdAt
      properties:
        id:              { type: integer }
        buyerPoNumber:   { type: string }
        customerName:    { type: string }
        buyerTotalUsd:   { type: number }
        buyerUnitPrice:  { type: number }
        buyerQuantity:   { type: integer }
        currency:        { type: string }
        notes:           { type: ["string", "null"] }
        targetSpreadPct: { type: ["number", "null"], description: "Target spread % for this deal. Null means no target set." }
        adjustmentsUsd:  { type: number, description: "Total hidden-cost adjustments applied to the spread, in USD." }
        adjustments:
          type: array
          items: { $ref: "#/components/schemas/DealAdjustment" }
        supplierCostUsd: { type: number }
        supplierPaidUsd: { type: number }
        spreadUsd:       { type: number }
        spreadPct:       { type: number }
        legs:
          type: array
          items: { $ref: "#/components/schemas/DealShipmentLeg" }
        createdAt: { type: string, format: date-time }

    Shipment:
      type: object
      required:
        - id
        - poNumber
        - product
        - category
        - supplierId
        - supplierName
        - customerName
        - status
        - currentStageId
        - dueDate
        - exFactoryDate
        - destination
        - via
        - payments
        - quotes
      properties:
        id:             { type: integer }
        poNumber:        { type: string, description: "Supplier-facing PO number (trader→supplier)" }
        buyerPoNumber:   { type: ["string", "null"], description: "Primary buyer-facing PO number (buyer→trader). Null if no deal is linked." }
        buyerPoNumbers:
          type: array
          items: { type: string }
          description: "All buyer-facing PO numbers linked to this shipment via the deal_shipments join table."
        product:        { type: string }
        category:       { type: string }
        supplierId:     { type: integer }
        supplierName:   { type: string }
        customerName:   { type: string }
        buyerId:        { type: ["integer", "null"], description: "FK to the buyers table. Null if no buyer record is linked." }
        dealId:         { type: ["integer", "null"] }
        status:         { type: string }
        currentStageId: { type: string }
        dueDate:        { type: string, format: date-time }
        exFactoryDate:  { type: string, format: date-time }
        destination:    { type: string }
        via:            { type: string }
        notes:          { type: ["string", "null"] }
        quantity:       { type: integer, nullable: true }
        unitCostUsd:    { type: integer, nullable: true }
        buyerUnitPrice: { type: ["number", "null"], description: "Buyer-facing unit price from the linked deal. Null if no deal is linked." }
        buyerQuantity:  { type: ["integer", "null"], description: "Buyer quantity from the linked deal. Null if no deal is linked." }
        spreadUsd:      { type: ["number", "null"], description: "Net spread in USD (buyer total − supplier cost − deal adjustments). Null if no deal is linked." }
        spreadPct:      { type: ["number", "null"], description: "Net margin % (spreadUsd / buyerTotalUsd × 100). Null if no deal is linked or buyer total is zero." }
        targetSpreadPct: { type: ["number", "null"], description: "Target spread % from the linked deal. Null if no deal is linked or no target set." }
        adjustmentsUsd: { type: ["number", "null"], description: "Total hidden-cost adjustments (USD) from the linked deal subtracted from the spread. Null if no deal is linked." }
        adjustments:
          type: array
          items: { $ref: "#/components/schemas/DealAdjustment" }
          description: "Hidden-cost adjustment lines from the linked deal. Empty if none or no deal linked."
        assigneeId:     { type: ["string", "null"], description: "Clerk userId of the assigned team member" }
        assigneeName:   { type: ["string", "null"], description: "Display name of the assigned team member" }
        archivedAt:     { type: ["string", "null"], format: date-time, description: "ISO timestamp when this shipment was archived. Null means active." }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        quotes:
          type: array
          items: { $ref: "#/components/schemas/FactoryQuote" }
    ShipmentCreate:
      type: object
      required:
        - poNumber
        - product
        - category
        - supplierId
        - customerName
        - dueDate
        - exFactoryDate
        - destination
      properties:
        poNumber:       { type: string, description: "Supplier-facing PO number (trader→supplier)" }
        buyerPoNumber:  { type: string, description: "Buyer-facing PO number (buyer→trader). Creates or links a deal." }
        product:        { type: string }
        category:       { type: string }
        supplierId:     { type: integer }
        customerName:   { type: string }
        status:         { type: string }
        currentStageId: { type: string }
        dueDate:        { type: string, format: date-time }
        exFactoryDate:  { type: string, format: date-time }
        destination:    { type: string }
        via:            { type: string }
        notes:          { type: string }
        quantity:       { type: integer }
        unitCostUsd:    { type: integer }
        buyerUnitPrice: { type: number, description: "Buyer-facing unit price (USD). Used to set/update the linked deal's pricing." }
        buyerQuantity:  { type: integer, description: "Total buyer quantity. Together with buyerUnitPrice, determines buyerTotalUsd on the linked deal." }
        payments:
          type: array
          items: { $ref: "#/components/schemas/PaymentMilestoneInput" }
    PaymentMilestoneInput:
      type: object
      required: [label, percent, dueDate]
      properties:
        label:   { type: string }
        percent: { type: integer }
        dueDate: { type: string, format: date-time }
    ShipmentUpdate:
      type: object
      properties:
        status:         { type: string }
        currentStageId: { type: string }
        assigneeId:     { type: ["string", "null"] }
        supplierId:     { type: integer }
        product:        { type: string }
        category:       { type: string }
        customerName:   { type: string }
        dueDate:        { type: string, format: date-time }
        exFactoryDate:  { type: string, format: date-time }
        destination:    { type: string }
        via:            { type: string }
        notes:          { type: ["string", "null"] }
        quantity:       { type: ["integer", "null"] }
        unitCostUsd:    { type: ["integer", "null"] }
        archivedAt:     { type: ["string", "null"], format: date-time, description: "Set to an ISO timestamp to archive, null to unarchive." }

    StageEvent:
      type: object
      required: [id, shipmentId, fromStageId, toStageId, createdAt]
      properties:
        id:          { type: integer }
        shipmentId:  { type: integer }
        fromStageId: { type: string }
        toStageId:   { type: string }
        note:        { type: ["string", "null"] }
        createdBy:   { type: ["string", "null"], description: "Name of the user who made the change, set server-side from the authenticated session" }
        createdAt:   { type: string, format: date-time }
    StageEventInput:
      type: object
      required: [fromStageId, toStageId]
      properties:
        fromStageId: { type: string }
        toStageId:   { type: string }
        note:        { type: string }
        createdBy:   { type: string, description: "Display name of the author; overridden server-side by the authenticated user's name when available" }

    Message:
      type: object
      required:
        - id
        - sender
        - channel
        - direction
        - snippet
        - fullBody
        - aiDraft
        - aiAction
        - aiTags
        - unread
        - isFlagged
        - receivedAt
        - routingStatus
      properties:
        id:                     { type: integer }
        shipmentId:             { type: ["integer", "null"], description: "null for needs-review messages not yet assigned to a shipment" }
        supplierId:             { type: ["integer", "null"] }
        sender:                 { type: string }
        recipient:              { type: ["string", "null"], description: "Outbound recipient — supplier email or name" }
        channel:                { type: string }
        subject:                { type: ["string", "null"], description: "Subject line for outbound email messages" }
        direction:              { type: string, enum: [inbound, outbound], default: inbound }
        snippet:                { type: string }
        fullBody:               { type: string }
        aiDraft:                { type: string }
        aiAction:               { type: string }
        aiTags:
          type: array
          items: { type: string }
        unread:                 { type: boolean }
        isFlagged:              { type: boolean }
        receivedAt:             { type: string, format: date-time }
        routingStatus:          { type: string, enum: [routed, needs-review], description: "routed = auto-assigned; needs-review = awaiting manual assignment" }
        routingConfidence:      { type: ["number", "null"], description: "0–1 confidence of the auto-routing decision" }
        matchMethod:            { type: ["string", "null"], description: "How the sender was matched: exact-email | exact-domain | fuzzy-name | buyer-learned | ai-inferred | unresolvable" }
        rawSenderEmail:         { type: ["string", "null"], description: "The original sender email address" }
        rawChatText:            { type: ["string", "null"], description: "Original pasted or forwarded chat text for audit" }
        routedToClerkUserId:    { type: ["string", "null"], description: "Clerk user ID of the team member whose plus-token received this email" }
        routedToUserName:       { type: ["string", "null"], description: "Display name of the team member this email was addressed to (resolved from routedToClerkUserId)" }
        signalStatus:           { type: string, description: "Signal Inbox lifecycle state: new | assessing | draft_ready | approved | sending | sent | send_failed | send_uncertain | skipped. send_uncertain is terminal and non-retryable — the email may have been sent; check Gmail via the audit trail dispatchKey before any manual action." }
        aiRoutingGuess:
          type: ["object", "null"]
          description: "AI's best guess for assignment (when confidence is low)"
          properties:
            buyerName:   { type: ["string", "null"] }
            shipmentId:  { type: ["integer", "null"] }
            confidence:  { type: number }
            reasoning:   { type: string }
        pendingExtractionFields:
          type: ["object", "null"]
          description: "Low-confidence field extractions awaiting human confirmation"
          properties:
            exFactoryDate: { type: ["string", "null"] }
            quantity:      { type: ["integer", "null"] }
            delayDays:     { type: ["integer", "null"] }
            newStatus:     { type: ["string", "null"] }
            confidence:    { type: number }
        inactiveContactRule:
          type: ["object", "null"]
          description: "Deactivated routing rule for this sender — their previous shipment closed"
          properties:
            fromEmail:     { type: string, description: "The sender email address that had the rule" }
            oldPoNumber:   { type: string, description: "PO number of the shipment that closed and deactivated the rule" }
            oldShipmentId: { type: integer, description: "DB id of the shipment that closed" }
    MessageInput:
      type: object
      required: [sender, channel, snippet, fullBody]
      properties:
        shipmentId:        { type: ["integer", "null"] }
        supplierId:        { type: ["integer", "null"] }
        sender:            { type: string }
        recipient:         { type: string, description: "Outbound recipient — supplier email or name" }
        channel:           { type: string }
        subject:           { type: string, description: "Subject line for outbound email messages" }
        direction:         { type: string, enum: [inbound, outbound] }
        snippet:           { type: string }
        fullBody:          { type: string }
        aiDraft:           { type: string }
        aiAction:          { type: string }
        aiTags:
          type: array
          items: { type: string }
        attachmentBase64:  { type: string, description: "Base64-encoded file content (WhatsApp media)" }
        attachmentMimeType: { type: string, description: "MIME type of the attachment" }
        attachmentName:    { type: string, description: "Original filename of the attachment" }
        routingStatus:     { type: string, enum: [routed, needs-review], description: "Override auto-routing; defaults to routed" }
        routingConfidence: { type: ["number", "null"], description: "0–1 confidence score from chat ingest" }
        matchMethod:       { type: ["string", "null"], description: "How the sender was matched" }
        rawChatText:       { type: ["string", "null"], description: "Original pasted or forwarded chat text for audit" }
    MessageUpdate:
      type: object
      properties:
        unread:    { type: boolean }
        isFlagged: { type: boolean }
        aiDraft:   { type: string }


        supplierPo: { type: string, description: "Next supplier-facing PO number (trader→supplier)" }

    PoNumberingConfig:
      type: object
      required: [id, prefix, sequenceFormat, supplierSuffix, nextSeq, updatedAt, preview]
      properties:
        id:             { type: integer }
        prefix:         { type: string, description: "Common prefix for both PO sides, e.g. 'PO-'" }
        sequenceFormat: { type: string, description: "Sequence format string using {seq} placeholder, e.g. '2026-{seq}'" }
        supplierSuffix: { type: string, description: "Suffix appended only to the supplier PO, e.g. 'S'" }
        nextSeq:        { type: integer, description: "Next sequence number to be consumed" }
        updatedAt:      { type: string, format: date-time }
        preview:
          type: object
          required: [buyerPo, supplierPo]
          properties:
            buyerPo:    { type: string }
            supplierPo: { type: string }


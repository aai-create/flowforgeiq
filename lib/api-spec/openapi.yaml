        shipmentId:            { type: integer }
        riskScore:             { type: integer }
        predictedEtaMin:       { type: string, format: date-time }
        predictedEtaMax:       { type: string, format: date-time }
        confidence:            { type: number }
        contributingSignals:
          type: array
          items: { $ref: "#/components/schemas/ContributingSignal" }
        recommendedMitigations:
          type: array
          items: { $ref: "#/components/schemas/RecommendedMitigation" }
        computedAt:            { type: string, format: date-time }

    RiskRadarItem:
      type: object
      required: [shipmentId, poNumber, product, supplierName, customerName, status, riskScore, predictedEtaMin, predictedEtaMax, confidence, financialExposureUsd, riskExposureUsd, topSignal, computedAt]
      properties:
        shipmentId:          { type: integer }
        poNumber:            { type: string }
        product:             { type: string }
        supplierName:        { type: string }
        customerName:        { type: string }
        status:              { type: string }
        riskScore:           { type: integer }
        predictedEtaMin:     { type: string, format: date-time }
        predictedEtaMax:     { type: string, format: date-time }
        confidence:          { type: number }
        financialExposureUsd: { type: number }
        riskExposureUsd:     { type: number }
        topSignal:           { type: string }
        computedAt:          { type: string, format: date-time }

    RiskRadarResponse:
      type: object
      required: [items, totalExposureUsd, highRiskCount, generatedAt]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RiskRadarItem" }
        totalExposureUsd:  { type: number }
        highRiskCount:     { type: integer }
        generatedAt:       { type: string, format: date-time }

    AccuracyBucket:
      type: object
      required: [leadTimeDays, totalPredictions, withinOneDayCount, withinThreeDayCount, withinSevenDayCount]
      properties:
        leadTimeDays:       { type: string }
        totalPredictions:   { type: integer }
        withinOneDayCount:  { type: integer }
        withinThreeDayCount: { type: integer }
        withinSevenDayCount: { type: integer }

    PredictionAccuracyReport:
      type: object
      required: [totalPredictions, resolvedPredictions, overallWithinThreeDaysPct, overallWithinSevenDaysPct, buckets, lastUpdated, disclaimer]
      properties:
        totalPredictions:           { type: integer }
        resolvedPredictions:        { type: integer }
        overallWithinThreeDaysPct:  { type: number }
        overallWithinSevenDaysPct:  { type: number }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/AccuracyBucket" }
        lastUpdated: { type: string, format: date-time }
        disclaimer:  { type: string }

    ExtractionCorrection:
      type: object
      required: [id, extractionId, documentType, fieldPath, correctedValue, createdAt]
      properties:
        id: { type: integer }
        extractionId: { type: integer }
        supplierId: { type: ["integer", "null"] }
        documentType: { type: string }
        fieldPath: { type: string }
        originalValue: { type: ["string", "null"] }
        correctedValue: { type: string }
        createdAt: { type: string, format: date-time }

    CopilotProposal:
      type: object
      required: [id, shipmentId, triggerType, actionType, payload, reasoning, confidence, status, createdAt, updatedAt]
      properties:
        id:             { type: integer }
        shipmentId:     { type: integer }
        triggerType:    { type: string }
        triggerRef:     { type: ["string", "null"] }
        actionType:     { type: string }
        payload:        { type: object, additionalProperties: true }
        reasoning:      { type: string }
        confidence:     { type: number }
        status:         { type: string }
        snoozedUntil:   { type: ["string", "null"], format: date-time }
        editedPayload:  { type: ["object", "null"], additionalProperties: true }
        auditTrail:     { type: array, items: { type: object, additionalProperties: true } }
        createdAt:      { type: string, format: date-time }
        updatedAt:      { type: string, format: date-time }

    CopilotProposalInput:
      type: object
      required: [shipmentId, triggerType, actionType, payload, reasoning]
      properties:
        shipmentId:  { type: integer }
        triggerType: { type: string }
        triggerRef:  { type: string }
        actionType:  { type: string }
        payload:     { type: object, additionalProperties: true }
        reasoning:   { type: string }
        confidence:  { type: number }

    CopilotProposalUpdate:
      type: object
      properties:
        status:        { type: string }
        editedPayload: { type: object, additionalProperties: true }
        snoozedUntil:  { type: string, format: date-time }

    CopilotTriggerResult:
      type: object
      required: [scanned, created, autoExecuted]
      properties:
        scanned:      { type: integer }
        created:      { type: integer }
        autoExecuted: { type: integer }
        proposals:
          type: array
          items: { $ref: "#/components/schemas/CopilotProposal" }

    CopilotSummary:
      type: object
      required: [pending, autoExecuted, snoozed, rejected, watched]
      properties:
        pending:      { type: integer }
        autoExecuted: { type: integer }
        snoozed:      { type: integer }
        rejected:     { type: integer }
        watched:      { type: integer }
        highlights:
          type: array
          items: { type: string }
        recentActions:
          type: array
          items: { $ref: "#/components/schemas/CopilotProposal" }

    AutonomyPolicy:
      type: object
      required: [id, policy, createdAt, updatedAt]
      properties:
        id:           { type: integer }
        supplierName: { type: ["string", "null"] }
        actionType:   { type: ["string", "null"] }
        policy:       { type: string }
        createdAt:    { type: string, format: date-time }
        updatedAt:    { type: string, format: date-time }

    AutonomyPolicyInput:
      type: object
      required: [policy]
      properties:
        supplierName: { type: string }
        actionType:   { type: string }
        policy:       { type: string }

    InboundEmailAttachment:
      type: object
      required: [Name, Content, ContentType]
      properties:
        Name: { type: string }
        Content: { type: string, description: "Base64-encoded file content" }
        ContentType: { type: string }
        ContentLength: { type: integer }

    InboundEmailWebhook:
      type: object
      properties:
        From: { type: string }
        FromName: { type: string }
        Subject: { type: string }
        TextBody: { type: string }
        HtmlBody: { type: string }
        Attachments:
          type: array
          items: { $ref: "#/components/schemas/InboundEmailAttachment" }

    InboundEmailWebhookResponse:
      type: object
      required: [accepted, documentIds]
      properties:
        accepted: { type: boolean }
        documentIds:
          type: array
          items: { type: integer }

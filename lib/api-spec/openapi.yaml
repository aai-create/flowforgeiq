openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: stages
  - name: suppliers
  - name: shipments
  - name: payments
  - name: quotes
  - name: messages
  - name: tasks
  - name: deals
  - name: documents
  - name: extractions
  - name: predictions
  - name: copilot
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /stages:
    get:
      operationId: listStages
      tags: [stages]
      responses:
        "200":
          description: Stages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Stage" }
  /stages/reorder:
    post:
      operationId: reorderStages
      tags: [stages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageOrderInput" }
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Stage" }

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      responses:
        "200":
          description: Suppliers with thread counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierSummary" }

  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update supplier fields (e.g. contactEmail)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierUpdate" }
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierSummary" }
        "404":
          description: Supplier not found

  /deals:
    get:
      operationId: listDeals
      tags: [deals]
      summary: List all deals with embedded shipments and computed spread
      responses:
        "200":
          description: All deals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DealWithSpread" }
    post:
      operationId: createDeal
      tags: [deals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealInput" }
      responses:
        "201":
          description: Created deal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealWithSpread" }
  /deals/{id}:
    get:
      operationId: getDeal
      tags: [deals]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deal with spread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealWithSpread" }
    patch:
      operationId: updateDeal
      tags: [deals]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealInput" }
      responses:
        "200":
          description: Updated deal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealWithSpread" }

  /shipments:
    get:
      operationId: listShipments
      tags: [shipments]
      responses:
        "200":
          description: All shipments with embedded payments and quotes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Shipment" }
    post:
      operationId: createShipment
      tags: [shipments]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentCreate" }
      responses:
        "201":
          description: Created shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
  /shipments/{id}:
    patch:
      operationId: updateShipment
      tags: [shipments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentUpdate" }
      responses:
        "200":
          description: Updated shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }

  /payments/{id}:
    patch:
      operationId: updatePayment
      tags: [payments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentUpdate" }
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }

  /shipments/{id}/select-quote:
    post:
      operationId: selectFactoryQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteSelection" }
      responses:
        "200":
          description: Updated quotes for shipment
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FactoryQuote" }

  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      responses:
        "200":
          description: All messages newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: createMessage
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /messages/{id}:
    patch:
      operationId: updateMessage
      tags: [messages]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      responses:
        "200":
          description: All tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      parameters:
        - in: query
          name: shipmentId
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: All documents with extractions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentWithExtraction" }
    post:
      operationId: uploadDocument
      tags: [documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                shipmentId:
                  type: integer
                sourceChannel:
                  type: string
      responses:
        "201":
          description: Created document, extraction in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentWithExtraction" }

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Document with extraction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentWithExtraction" }
    patch:
      operationId: updateDocument
      tags: [documents]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUpdate" }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentWithExtraction" }

  /shipments/{id}/prediction:
    get:
      operationId: getShipmentPrediction
      tags: [predictions]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Latest prediction for shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentPrediction" }
        "404":
          description: No prediction yet
    post:
      operationId: computeShipmentPrediction
      tags: [predictions]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Freshly computed prediction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentPrediction" }

  /shipments/{id}/prediction/history:
    get:
      operationId: getShipmentPredictionHistory
      tags: [predictions]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Prediction history for shipment
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShipmentPrediction" }

  /risk-radar:
    get:
      operationId: getRiskRadar
      tags: [predictions]
      responses:
        "200":
          description: Portfolio risk view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskRadarResponse" }

  /predictions/accuracy:
    get:
      operationId: getPredictionAccuracy
      tags: [predictions]
      responses:
        "200":
          description: Accuracy report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PredictionAccuracyReport" }

  /copilot/proposals:
    get:
      operationId: listCopilotProposals
      tags: [copilot]
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string }
        - in: query
          name: shipmentId
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: List of copilot proposals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CopilotProposal" }
    post:
      operationId: createCopilotProposal
      tags: [copilot]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopilotProposalInput" }
      responses:
        "201":
          description: Created proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotProposal" }

  /copilot/proposals/{id}:
    patch:
      operationId: updateCopilotProposal
      tags: [copilot]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopilotProposalUpdate" }
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotProposal" }

  /copilot/trigger:
    post:
      operationId: triggerCopilot
      tags: [copilot]
      summary: Scan all active shipments and generate new proposals
      responses:
        "200":
          description: Trigger result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotTriggerResult" }

  /copilot/summary:
    get:
      operationId: getCopilotSummary
      tags: [copilot]
      responses:
        "200":
          description: Daily summary of copilot activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotSummary" }

  /copilot/policies:
    get:
      operationId: listAutonomyPolicies
      tags: [copilot]
      responses:
        "200":
          description: List of autonomy policies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutonomyPolicy" }
    put:
      operationId: upsertAutonomyPolicy
      tags: [copilot]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutonomyPolicyInput" }
      responses:
        "200":
          description: Upserted policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomyPolicy" }

  /webhooks/email:
    post:
      operationId: inboundEmailWebhook
      tags: [documents]
      summary: Inbound email webhook (Postmark / SendGrid)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboundEmailWebhook" }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboundEmailWebhookResponse" }

  /extractions/{id}/corrections:
    post:
      operationId: saveExtractionCorrection
      tags: [extractions]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractionCorrectionInput" }
      responses:
        "200":
          description: Correction saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractionCorrection" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Stage:
      type: object
      required: [id, label, sortOrder]
      properties:
        id:        { type: string }
        label:     { type: string }
        sortOrder: { type: integer }
    StageOrderInput:
      type: object
      required: [stageIds]
      properties:
        stageIds:
          type: array
          items: { type: string }

    SupplierSummary:
      type: object
      required: [id, name, country, threadCount]
      properties:
        id:           { type: integer }
        name:         { type: string }
        country:      { type: string }
        contactEmail: { type: string, nullable: true }
        threadCount:  { type: integer }

    SupplierUpdate:
      type: object
      properties:
        contactEmail: { type: string, nullable: true }

    Payment:
      type: object
      required: [id, shipmentId, label, percent, amountUsd, paid, dueDate, sortOrder]
      properties:
        id:         { type: integer }
        shipmentId: { type: integer }
        label:      { type: string }
        percent:    { type: integer }
        amountUsd:  { type: integer }
        paid:       { type: boolean }
        dueDate:    { type: string, format: date-time }
        sortOrder:  { type: integer }
    PaymentUpdate:
      type: object
      properties:
        paid: { type: boolean }

    FactoryQuote:
      type: object
      required: [id, shipmentId, factory, country, unitPrice, leadDays, moq, selected, sortOrder]
      properties:
        id:         { type: integer }
        shipmentId: { type: integer }
        factory:    { type: string }
        country:    { type: string }
        unitPrice:  { type: number }
        leadDays:   { type: integer }
        moq:        { type: integer }
        selected:   { type: boolean }
        sortOrder:  { type: integer }
    QuoteSelection:
      type: object
      required: [quoteId]
      properties:
        quoteId: { type: integer }

    DealInput:
      type: object
      required: [buyerPoNumber, customerName, buyerTotalUsd, buyerUnitPrice, buyerQuantity]
      properties:
        buyerPoNumber:  { type: string }
        customerName:   { type: string }
        buyerTotalUsd:  { type: number }
        buyerUnitPrice: { type: number }
        buyerQuantity:  { type: integer }
        currency:       { type: string }
        notes:          { type: string }

    DealShipmentLeg:
      type: object
      required: [id, poNumber, product, supplierName, supplierCost, status, currentStageId, exFactoryDate]
      properties:
        id:             { type: integer }
        poNumber:       { type: string }
        product:        { type: string }
        supplierName:   { type: string }
        supplierCost:   { type: number }
        supplierPaid:   { type: number }
        status:         { type: string }
        currentStageId: { type: string }
        exFactoryDate:  { type: string, format: date-time }

    DealWithSpread:
      type: object
      required:
        - id
        - buyerPoNumber
        - customerName
        - buyerTotalUsd
        - buyerUnitPrice
        - buyerQuantity
        - currency
        - supplierCostUsd
        - supplierPaidUsd
        - spreadUsd
        - spreadPct
        - legs
        - createdAt
      properties:
        id:              { type: integer }
        buyerPoNumber:   { type: string }
        customerName:    { type: string }
        buyerTotalUsd:   { type: number }
        buyerUnitPrice:  { type: number }
        buyerQuantity:   { type: integer }
        currency:        { type: string }
        notes:           { type: ["string", "null"] }
        supplierCostUsd: { type: number }
        supplierPaidUsd: { type: number }
        spreadUsd:       { type: number }
        spreadPct:       { type: number }
        legs:
          type: array
          items: { $ref: "#/components/schemas/DealShipmentLeg" }
        createdAt: { type: string, format: date-time }

    Shipment:
      type: object
      required:
        - id
        - poNumber
        - product
        - category
        - supplierId
        - supplierName
        - customerName
        - status
        - currentStageId
        - dueDate
        - exFactoryDate
        - destination
        - via
        - payments
        - quotes
      properties:
        id:             { type: integer }
        poNumber:       { type: string }
        product:        { type: string }
        category:       { type: string }
        supplierId:     { type: integer }
        supplierName:   { type: string }
        customerName:   { type: string }
        dealId:         { type: ["integer", "null"] }
        status:         { type: string }
        currentStageId: { type: string }
        dueDate:        { type: string, format: date-time }
        exFactoryDate:  { type: string, format: date-time }
        destination:    { type: string }
        via:            { type: string }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        quotes:
          type: array
          items: { $ref: "#/components/schemas/FactoryQuote" }
    ShipmentCreate:
      type: object
      required:
        - product
        - category
        - supplierId
        - customerName
        - dueDate
        - exFactoryDate
      properties:
        poNumber:       { type: string }
        product:        { type: string }
        category:       { type: string }
        supplierId:     { type: integer }
        customerName:   { type: string }
        status:         { type: string }
        currentStageId: { type: string }
        dueDate:        { type: string, format: date-time }
        exFactoryDate:  { type: string, format: date-time }
        destination:    { type: string }
        via:            { type: string }
    ShipmentUpdate:
      type: object
      properties:
        status:         { type: string }
        currentStageId: { type: string }

    Message:
      type: object
      required:
        - id
        - shipmentId
        - sender
        - channel
        - snippet
        - fullBody
        - aiDraft
        - aiAction
        - aiTags
        - unread
        - receivedAt
      properties:
        id:         { type: integer }
        shipmentId: { type: integer }
        supplierId: { type: ["integer", "null"] }
        sender:     { type: string }
        channel:    { type: string }
        snippet:    { type: string }
        fullBody:   { type: string }
        aiDraft:    { type: string }
        aiAction:   { type: string }
        aiTags:
          type: array
          items: { type: string }
        unread:     { type: boolean }
        receivedAt: { type: string, format: date-time }
    MessageInput:
      type: object
      required: [shipmentId, sender, channel, snippet, fullBody]
      properties:
        shipmentId:        { type: integer }
        supplierId:        { type: ["integer", "null"] }
        sender:            { type: string }
        channel:           { type: string }
        snippet:           { type: string }
        fullBody:          { type: string }
        aiDraft:           { type: string }
        aiAction:          { type: string }
        aiTags:
          type: array
          items: { type: string }
        attachmentBase64:  { type: string, description: "Base64-encoded file content (WhatsApp media)" }
        attachmentMimeType: { type: string, description: "MIME type of the attachment" }
        attachmentName:    { type: string, description: "Original filename of the attachment" }
    MessageUpdate:
      type: object
      properties:
        unread:  { type: boolean }
        aiDraft: { type: string }

    Task:
      type: object
      required: [id, shipmentId, title, source, sourceAge, urgency, action, done]
      properties:
        id:         { type: integer }
        shipmentId: { type: integer }
        messageId:  { type: ["integer", "null"] }
        title:      { type: string }
        source:     { type: string }
        sourceAge:  { type: string }
        urgency:    { type: string }
        action:     { type: string }
        done:       { type: boolean }
    TaskUpdate:
      type: object
      properties:
        done: { type: boolean }

    ExtractedLineItem:
      type: object
      properties:
        description: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        totalPrice: { type: number }
        unit: { type: string }
        discrepancy: { type: string }

    ExtractedFields:
      type: object
      properties:
        poNumber: { type: string }
        supplier: { type: string }
        buyer: { type: string }
        invoiceNumber: { type: string }
        invoiceDate: { type: string }
        currency: { type: string }
        totalAmount: { type: number }
        incoterms: { type: string }
        paymentTerms: { type: string }
        etd: { type: string }
        eta: { type: string }
        portOfLoading: { type: string }
        portOfDischarge: { type: string }
        documentType: { type: string }
        qcResult: { type: string }
        qcIssues:
          type: array
          items: { type: string }
        transcriptSummary: { type: string }
        detectedEntities:
          type: array
          items: { type: string }

    ReconciliationFinding:
      type: object
      properties:
        type: { type: string }
        field: { type: string }
        expected: { type: string }
        actual: { type: string }
        severity: { type: string }

    FieldProvenanceEntry:
      type: object
      properties:
        confidence: { type: number }
        snippet: { type: string }

    Extraction:
      type: object
      required: [id, documentId, confidence, status, extractedFields, fieldProvenance, lineItems, reconciliationFindings, createdAt]
      properties:
        id: { type: integer }
        documentId: { type: integer }
        shipmentMatchId: { type: ["integer", "null"] }
        extractedFields: { $ref: "#/components/schemas/ExtractedFields" }
        fieldProvenance:
          type: object
          additionalProperties: { $ref: "#/components/schemas/FieldProvenanceEntry" }
        lineItems:
          type: array
          items: { $ref: "#/components/schemas/ExtractedLineItem" }
        reconciliationFindings:
          type: array
          items: { $ref: "#/components/schemas/ReconciliationFinding" }
        transcriptText: { type: ["string", "null"] }
        confidence: { type: number }
        status: { type: string }
        errorMessage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    DocumentWithExtraction:
      type: object
      required: [id, fileName, fileType, mimeType, fileSize, sourceChannel, status, createdAt]
      properties:
        id: { type: integer }
        shipmentId: { type: ["integer", "null"] }
        fileName: { type: string }
        fileType: { type: string }
        mimeType: { type: string }
        fileSize: { type: integer }
        sourceChannel: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        extraction: { $ref: "#/components/schemas/Extraction" }

    DocumentUpdate:
      type: object
      properties:

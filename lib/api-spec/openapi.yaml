openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: stages
  - name: suppliers
  - name: shipments
  - name: payments
  - name: quotes
  - name: messages
  - name: tasks
  - name: deals
  - name: documents
  - name: extractions
  - name: predictions
  - name: copilot
  - name: settings
  - name: integrations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /stages:
    get:
      operationId: listStages
      tags: [stages]
      responses:
        "200":
          description: Stages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Stage" }
  /stages/reorder:
    post:
      operationId: reorderStages
      tags: [stages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageOrderInput" }
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Stage" }

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      responses:
        "200":
          description: Suppliers with thread counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierSummary" }
    post:
      operationId: createSupplier
      tags: [suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierCreate" }
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierSummary" }

  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update supplier fields (e.g. contactEmail)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierUpdate" }
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierSummary" }
        "404":
          description: Supplier not found

  /deals:
    get:
      operationId: listDeals
      tags: [deals]
      summary: List all deals with embedded shipments and computed spread
      responses:
        "200":
          description: All deals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DealWithSpread" }
    post:
      operationId: createDeal
      tags: [deals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealInput" }
      responses:
        "201":
          description: Created deal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealWithSpread" }
  /deals/{id}:
    get:
      operationId: getDeal
      tags: [deals]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deal with spread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealWithSpread" }
    patch:
      operationId: updateDeal
      tags: [deals]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealInput" }
      responses:
        "200":
          description: Updated deal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealWithSpread" }

  /shipments:
    get:
      operationId: listShipments
      tags: [shipments]
      responses:
        "200":
          description: All shipments with embedded payments and quotes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Shipment" }
    post:
      operationId: createShipment
      tags: [shipments]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentCreate" }
      responses:
        "201":
          description: Created shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
  /shipments/{id}:
    patch:
      operationId: updateShipment
      tags: [shipments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentUpdate" }
      responses:
        "200":
          description: Updated shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }

  /payments/{id}:
    patch:
      operationId: updatePayment
      tags: [payments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentUpdate" }
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }

  /shipments/{id}/quotes:
    get:
      operationId: listShipmentQuotes
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Quotes for shipment
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FactoryQuote" }
    post:
      operationId: createFactoryQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryQuoteCreate" }
      responses:
        "201":
          description: Created quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryQuote" }

  /shipments/{id}/deals:
    post:
      operationId: linkDealToShipment
      tags: [shipments]
      summary: Link an existing deal (buyer PO) to this shipment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dealId]
              properties:
                dealId: { type: integer }
      responses:
        "201":
          description: Shipment with updated buyer PO links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "404":
          description: Shipment or deal not found

  /shipments/{id}/deals/{dealId}:
    delete:
      operationId: unlinkDealFromShipment
      tags: [shipments]
      summary: Unlink a deal from this shipment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: dealId
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Unlinked successfully

  /shipments/{id}/stage-events:
    get:
      operationId: listShipmentStageEvents
      tags: [shipments]
      summary: Get stage advancement history for a shipment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Stage event history (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StageEvent" }
    post:
      operationId: createShipmentStageEvent
      tags: [shipments]
      summary: Record a stage advancement with optional note
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageEventInput" }
      responses:
        "201":
          description: Created stage event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StageEvent" }

  /shipments/{id}/select-quote:
    post:
      operationId: selectFactoryQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteSelection" }
      responses:
        "200":
          description: Updated quotes for shipment
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FactoryQuote" }

  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      parameters:
        - in: query
          name: isFlagged
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: All messages newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: createMessage
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /messages/needs-review:
    get:
      operationId: listNeedsReviewMessages
      tags: [messages]
      summary: Messages that could not be auto-routed and need manual assignment
      responses:
        "200":
          description: Needs-review messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }

  /messages/{id}:
    patch:
      operationId: updateMessage
      tags: [messages]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /messages/{id}/assign:
    patch:
      operationId: assignMessage
      tags: [messages]
      summary: Manually assign a needs-review message to a buyer and shipment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageAssignInput" }
      responses:
        "200":
          description: Assigned message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404":
          description: Message not found

  /messages/{id}/send-reply:
    post:
      operationId: sendReply
      tags: [messages]
      summary: Send a reply via Gmail (send-as from your real Gmail address)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendReplyInput" }
      responses:
        "201":
          description: Outbound message record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: Gmail not connected or message not found

  /integrations/gmail/status:
    get:
      operationId: getGmailStatus
      tags: [integrations]
      summary: Get Gmail OAuth connection status
      responses:
        "200":
          description: Gmail status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GmailStatus" }

  /integrations/gmail/connect:
    get:
      operationId: connectGmail
      tags: [integrations]
      summary: Start Gmail OAuth flow — returns authUrl for client-side popup
      responses:
        "200":
          description: Auth URL to open in a popup
          content:
            application/json:
              schema:
                type: object
                required: [authUrl]
                properties:
                  authUrl: { type: string, description: "Google OAuth URL — open in a popup window" }
        "400":
          description: OAuth credentials not configured

  /integrations/gmail/callback:
    get:
      operationId: gmailOAuthCallback
      tags: [integrations]
      summary: Gmail OAuth callback — exchanges code for tokens
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Connected successfully (HTML page)

  /integrations/gmail/disconnect:
    post:
      operationId: disconnectGmail
      tags: [integrations]
      summary: Revoke and remove stored Gmail OAuth credentials
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                required: [disconnected]
                properties:
                  disconnected: { type: boolean }

  /integrations/gmail/test:
    post:
      operationId: testGmailSend
      tags: [integrations]
      summary: Send a test email through the Gmail pipeline to verify the setup
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, description: "Recipient address for the test email" }
      responses:
        "200":
          description: Test email sent
          content:
            application/json:
              schema:
                type: object
                required: [sent, to, from]
                properties:
                  sent: { type: boolean }
                  to:   { type: string }
                  from: { type: string }
        "400":
          description: Gmail not connected

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      responses:
        "200":
          description: All tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      parameters:
        - in: query
          name: shipmentId
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: All documents with extractions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentWithExtraction" }
    post:
      operationId: uploadDocument
      tags: [documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                shipmentId:
                  type: integer
                sourceChannel:
                  type: string
      responses:
        "201":
          description: Created document, extraction in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentWithExtraction" }

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Document with extraction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentWithExtraction" }
    patch:
      operationId: updateDocument
      tags: [documents]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUpdate" }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentWithExtraction" }

  /shipments/{id}/prediction:
    get:
      operationId: getShipmentPrediction
      tags: [predictions]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Latest prediction for shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentPrediction" }
        "404":
          description: No prediction yet
    post:
      operationId: computeShipmentPrediction
      tags: [predictions]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Freshly computed prediction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentPrediction" }

  /shipments/{id}/prediction/history:
    get:
      operationId: getShipmentPredictionHistory
      tags: [predictions]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Prediction history for shipment
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShipmentPrediction" }

  /risk-radar:
    get:
      operationId: getRiskRadar
      tags: [predictions]
      responses:
        "200":
          description: Portfolio risk view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskRadarResponse" }

  /predictions/accuracy:
    get:
      operationId: getPredictionAccuracy
      tags: [predictions]
      responses:
        "200":
          description: Accuracy report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PredictionAccuracyReport" }

  /copilot/proposals:
    get:
      operationId: listCopilotProposals
      tags: [copilot]
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string }
        - in: query
          name: shipmentId
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: List of copilot proposals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CopilotProposal" }
    post:
      operationId: createCopilotProposal
      tags: [copilot]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopilotProposalInput" }
      responses:
        "201":
          description: Created proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotProposal" }

  /copilot/proposals/{id}:
    patch:
      operationId: updateCopilotProposal
      tags: [copilot]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopilotProposalUpdate" }
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotProposal" }

  /copilot/trigger:
    post:
      operationId: triggerCopilot
      tags: [copilot]
      summary: Scan all active shipments and generate new proposals
      responses:
        "200":
          description: Trigger result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotTriggerResult" }

  /copilot/summary:
    get:
      operationId: getCopilotSummary
      tags: [copilot]
      responses:
        "200":
          description: Daily summary of copilot activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotSummary" }

  /copilot/policies:
    get:
      operationId: listAutonomyPolicies
      tags: [copilot]
      responses:
        "200":
          description: List of autonomy policies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutonomyPolicy" }
    put:
      operationId: upsertAutonomyPolicy
      tags: [copilot]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutonomyPolicyInput" }
      responses:
        "200":
          description: Upserted policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomyPolicy" }

  /webhooks/email:
    post:
      operationId: inboundEmailWebhook
      tags: [documents]
      summary: Inbound email webhook (Postmark / SendGrid)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboundEmailWebhook" }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboundEmailWebhookResponse" }

  /extractions/{id}/corrections:
    post:
      operationId: saveExtractionCorrection
      tags: [extractions]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractionCorrectionInput" }
      responses:
        "200":
          description: Correction saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractionCorrection" }

  /settings/inbound-email:
    get:
      operationId: getInboundEmailAddress
      tags: [settings]
      summary: Get the configured inbound email address for chat/email forwarding
      responses:
        "200":
          description: Inbound email address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboundEmailAddress" }

  /messages/ingest-chat:
    post:
      operationId: ingestChat
      tags: [messages]
      summary: Process a pasted chat message (WhatsApp/WeChat/iMessage) and extract supply-chain data — preview only, does not save
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatIngestInput" }
      responses:
        "200":
          description: Extraction result preview (not yet saved — call POST /messages to confirm)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatIngestResult" }

  /settings/po-numbering:
    get:
      operationId: getPoNumberingConfig
      tags: [settings]
      summary: Get PO numbering configuration and preview next pair
      responses:
        "200":
          description: PO numbering config with preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoNumberingConfig" }
    put:
      operationId: updatePoNumberingConfig
      tags: [settings]
      summary: Update PO numbering configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoNumberingConfigUpdate" }
      responses:
        "200":
          description: Updated config with preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoNumberingConfig" }

  /settings/po-numbering/next:
    get:
      operationId: getNextPoNumbers
      tags: [settings]
      summary: Preview the next buyer and supplier PO number pair without consuming the sequence
      responses:
        "200":
          description: Next PO number pair (preview only, counter not advanced)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NextPoNumbers" }
    post:
      operationId: consumeNextPoNumbers
      tags: [settings]
      summary: Atomically consume the next PO number pair and advance the sequence counter
      responses:
        "200":
          description: Consumed PO number pair (counter has been advanced)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NextPoNumbers" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Stage:
      type: object
      required: [id, label, sortOrder]
      properties:
        id:        { type: string }
        label:     { type: string }
        sortOrder: { type: integer }
    StageOrderInput:
      type: object
      required: [stageIds]
      properties:
        stageIds:
          type: array

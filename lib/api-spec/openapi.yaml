        isConverging: { type: boolean, description: "True when edit distance is trending downward over the last 5+ edits (negative linear-regression slope)" }
        weeks:
          type: array
          description: "Weekly bucketed avg edit distance, chronologically sorted"
          items: { $ref: "#/components/schemas/CopilotDraftQualityWeekBucket" }

    CopilotSummary:

      properties:
        signal:      { type: string }
        description: { type: string }
        weight:      { type: number }
        direction:   { type: string }

    RecommendedMitigation:
      type: object
      required: [action, rationale]
      properties:
        action:           { type: string }
        rationale:        { type: string }
        estimatedCostUsd: { type: ["number", "null"] }
        recoveryDays:     { type: ["integer", "null"] }

    ShipmentPrediction:
      type: object
      required: [id, shipmentId, riskScore, predictedEtaMin, predictedEtaMax, confidence, contributingSignals, recommendedMitigations, computedAt]
      properties:
